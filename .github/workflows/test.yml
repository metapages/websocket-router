name: Test

# The checks that gate main. These are the names to list as required status
# checks in the branch ruleset: "Type check and build", "Integration suite"
# and "Certificate issuance".
#
# Triggered on pull requests, and callable from deploy.yml so that a push to
# main runs the identical jobs rather than a second copy that can drift. It
# deliberately does NOT trigger on push: a branch with an open pull request
# fires both events, which would put two check runs of each name on the same
# commit -- one of them skipped -- and a required check cannot tell which of
# those gates the merge.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Type checks and the full build, including the docs. The docs build is
  # part of this because vitepress fails on dead internal links, which makes
  # it the only check that catches a renamed page.
  # ---------------------------------------------------------------------
  quality:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          cd docs && npm ci --no-audit --no-fund

      - name: Type check
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.web.json --noEmit
          npx tsc -p tsconfig.test.json --noEmit

      - name: Build output must not be committed
        run: |
          for path in dist docs/.vitepress/dist; do
            if [ -n "$(git ls-files "$path")" ]; then
              echo "::error::$path is build output and must not be committed"
              exit 1
            fi
          done

      - name: Build
        run: |
          npm run build:server
          npm run build:web
          cd docs && npm run build 2>&1 | tee /tmp/docs-build.log && cd ..
          # vitepress exits 0 even when server-side rendering throws, leaving
          # pages without their nav or cross-links. deploy.sh checks for this
          # too; catching it here means a pull request fails rather than a
          # deploy.
          if grep -q "not properly injected" /tmp/docs-build.log; then
            echo "::error::docs built with server-side rendering errors"
            exit 1
          fi
          npm run compress

      - name: Precompressed variants exist
        run: |
          # The server serves .br/.gz siblings directly; if the compress step
          # silently produced nothing, every asset would quietly fall back to
          # uncompressed and nothing else would fail.
          count=$(find dist/web docs/.vitepress/dist -name '*.br' | wc -l)
          echo "found $count brotli variants"
          [ "$count" -gt 0 ] || { echo "::error::no .br files were produced"; exit 1; }

  # ---------------------------------------------------------------------
  # The integration suite, in containers. Running it here rather than on the
  # runner directly is what covers non-root operation.
  # ---------------------------------------------------------------------
  test:
    name: Integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: extractions/setup-just@v2

      - name: Run the suite
        run: just test

      - name: Server output on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color || true

  # ---------------------------------------------------------------------
  # Certificate issuance against pebble, Let's Encrypt's test ACME server.
  # Separate job: it needs extra services and is the slowest thing here.
  # ---------------------------------------------------------------------
  acme:
    name: Certificate issuance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: extractions/setup-just@v2

      - name: Run the ACME suite
        run: just test-acme

      - name: Pebble and server output on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml --profile acme logs --no-color || true
