name: CI

# Runs on every push to a branch other than main, on pull requests into main,
# and on demand. main itself is covered by the pull request run that merged into
# it, so pushing there does not re-run the same checks.
#
# A push to a branch that already has an open pull request fires BOTH events, so
# every job below is guarded to run the pull_request copy only for forks, whose
# pushes never reach this repository. See the `if:` on each job.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# head_ref is set for pull_request events, ref for push events. Keying on
# whichever exists puts both events for a branch in one group, so a new push
# cancels the previous run whichever event started it.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Type checks and the full build, including the docs. The docs build is
  # part of CI because vitepress fails on dead internal links, which makes
  # it the only check that catches a renamed page.
  # ---------------------------------------------------------------------
  quality:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Skip the duplicate pull_request run for branches in this repository; their
    # push event already ran. Fork pull requests have no push event here, so
    # this is the only run they get.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          cd docs && npm ci --no-audit --no-fund

      - name: Type check
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.web.json --noEmit
          npx tsc -p tsconfig.test.json --noEmit

      - name: Build output must not be committed
        run: |
          for path in dist docs/.vitepress/dist; do
            if [ -n "$(git ls-files "$path")" ]; then
              echo "::error::$path is build output and must not be committed"
              exit 1
            fi
          done

      - name: Build
        run: |
          npm run build:server
          npm run build:web
          cd docs && npm run build && cd ..
          npm run compress

      - name: Precompressed variants exist
        run: |
          # The server serves .br/.gz siblings directly; if the compress step
          # silently produced nothing, every asset would quietly fall back to
          # uncompressed and nothing else would fail.
          count=$(find dist/web docs/.vitepress/dist -name '*.br' | wc -l)
          echo "found $count brotli variants"
          [ "$count" -gt 0 ] || { echo "::error::no .br files were produced"; exit 1; }

  # ---------------------------------------------------------------------
  # The integration suite, in containers. Running it here rather than on the
  # runner directly is what covers non-root operation.
  # ---------------------------------------------------------------------
  test:
    name: Integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: extractions/setup-just@v2

      - name: Run the suite
        run: just test

      - name: Server output on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color || true

  # ---------------------------------------------------------------------
  # Certificate issuance against pebble, Let's Encrypt's test ACME server.
  # Separate job: it needs extra services and is the slowest thing here.
  # ---------------------------------------------------------------------
  acme:
    name: Certificate issuance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: extractions/setup-just@v2

      - name: Run the ACME suite
        run: just test-acme

      - name: Pebble and server output on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml --profile acme logs --no-color || true
