name: Deploy

# Builds, then deploys to every host in the DEPLOY_HOSTS repository variable
# over ssh, using the same `deploy/deploy.sh` you would run by hand. Nothing
# about the deployment is CI-specific: if Actions is down, the identical
# command from a checkout does the same thing.
#
# Setup (one-time, see docs/guide/self-hosting.md):
#   gh variable set DEPLOY_HOSTS --body "1.2.3.4"            # or a hostname
#   gh secret   set DEPLOY_SSH_PRIVATE_KEY < deploy_key      # root on the host
#   gh secret   set DEPLOY_SSH_KNOWN_HOSTS < known_hosts     # ssh-keyscan output
#
# Each host is an INDEPENDENT router: there is no shared bus, so DEPLOY_HOSTS
# is a list of separate deployments, not a cluster behind one name.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hosts:
        description: "Hosts to deploy to (space separated). Blank uses DEPLOY_HOSTS."
        required: false
        type: string
      skip_tests:
        description: "Skip the test job (use only to ship an urgent fix)"
        required: false
        default: false
        type: boolean

# Never deploy two revisions at once, and never cancel one mid-flight: a
# cancelled deploy can leave a host between releases. A second push waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate the deploy on the suite. Reusing the same containerised run as CI
  # rather than trusting that the pull request checked it, because a direct
  # push to main would otherwise reach production untested.
  test:
    name: Integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: extractions/setup-just@v2
      - name: Run the suite
        run: just test
      - name: Server output on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color || true

  deploy:
    name: Deploy
    needs: [test]
    # `always()` plus an explicit result check, so skip_tests can bypass the
    # gate without `needs` failing the job outright.
    if: ${{ always() && (needs.test.result == 'success' || inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Add required reviewers to this environment in repository settings to
    # make every deploy need an approval.
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Resolve target hosts
        id: hosts
        env:
          INPUT_HOSTS: ${{ inputs.hosts }}
          VAR_HOSTS: ${{ vars.DEPLOY_HOSTS }}
        run: |
          hosts="${INPUT_HOSTS:-$VAR_HOSTS}"
          if [ -z "${hosts// /}" ]; then
            echo "::error::No hosts. Set the DEPLOY_HOSTS repository variable."
            exit 1
          fi
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $hosts"

      - name: Configure ssh
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is not set."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "host key pinned from DEPLOY_SSH_KNOWN_HOSTS"
          else
            # Without a pinned key there is nothing to verify against, so the
            # first connection is trusted blindly. Works, but says so.
            echo "::warning::DEPLOY_SSH_KNOWN_HOSTS is not set; falling back to accept-new"
          fi

      - uses: extractions/setup-just@v2

      - name: Deploy
        env:
          # With a pinned host key, refuse anything that does not match it.
          # Without one there is nothing to compare against, so fall back to
          # trust-on-first-use rather than failing every deploy.
          STRICT: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS != '' && 'yes' || 'accept-new' }}
        run: |
          # deploy.sh passes SSH_OPTS verbatim to both ssh and scp.
          export SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o BatchMode=yes \
            -o StrictHostKeyChecking=$STRICT"
          ./deploy/deploy.sh ${{ steps.hosts.outputs.hosts }}

      - name: Verify each host over the network
        run: |
          for host in ${{ steps.hosts.outputs.hosts }}; do
            # The scheme depends on whether that host has TLS on; try https
            # first and fall back, so this works during the pre-DNS phase too.
            if curl -fsS --max-time 10 "https://$host/healthcheck" >/dev/null 2>&1; then
              url="https://$host"
            else
              url="http://$host"
            fi
            echo "::group::verify $url"
            just verify "$url"
            echo "::endgroup::"
          done

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
