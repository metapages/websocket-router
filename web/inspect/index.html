<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The URL of this page is the credential that opens it, so it must not
         be handed to any other origin in a Referer header. -->
    <meta name="referrer" content="no-referrer" />
    <title>Connection inspector</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Connection inspector</h1>
          <p class="muted" id="summary">loading…</p>
        </div>
        <div class="controls">
          <label class="checkbox">
            <input id="watch" type="checkbox" checked />
            watch traffic
          </label>
          <select id="sort">
            <option value="subscribers">busiest first</option>
            <option value="age">oldest first</option>
            <option value="recent">most recent message</option>
            <option value="name">by name</option>
          </select>
        </div>
      </header>

      <p id="error" class="error" role="alert" hidden></p>

      <section id="channels"></section>

      <p class="muted footnote">
        Every channel with at least one connection is listed. Messages are
        read by subscribing to each channel as a read-only client: nothing is
        buffered on the server, so this shows traffic from the moment the
        inspector connected, not before it.
      </p>
    </main>
  </body>
</html>
